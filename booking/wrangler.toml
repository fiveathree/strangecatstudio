name = "strangecat-booking"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Sites allowed to call the API from a browser. Add your own domain when you have one.
ALLOWED_ORIGINS = "https://fiveathree.github.io"

[[d1_databases]]
binding = "DB"
database_name = "strangecat-booking"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# The studio password for admin.html is a secret, not a variable:
#   npx wrangler secret put ADMIN_TOKEN
