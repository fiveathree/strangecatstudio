<section class="wrap" style="padding-top: 56px; padding-bottom: 96px; max-width: 860px">
<div class="eyebrow">CART ・ 購物車</div>
<h1 class="h-serif" style="font-size: 40px; margin: 8px 0 28px">購物車</h1>

<div id="cart-app" class="bk">
<p id="cart-loading" style="color: var(--soft)">載入中…</p>

<div id="cart-empty" hidden>
<p style="color: var(--soft)">購物車是空的。</p>
<a href="shop.html" class="bk-cal">去現貨選購看看</a>
</div>

<form id="cart-form" class="bk" hidden novalidate>
<div id="cart-items" class="cart-items"></div>

<div>
<div class="filter-title">取貨方式</div>
<div id="cart-ship" class="chip-row"></div>
<div class="bk-input" id="cart-shipto-wrap" style="margin-top: 14px" hidden><label for="cart-shipto" id="cart-shipto-label"></label><input id="cart-shipto" type="text" maxlength="160"></div>
</div>

<div>
<div class="filter-title">聯絡資料</div>
<div class="bk-form">
<div class="bk-input"><label for="cart-name">姓名</label><input id="cart-name" type="text" maxlength="40" autocomplete="name" required></div>
<div class="bk-input"><label for="cart-phone">手機</label><input id="cart-phone" type="tel" maxlength="20" autocomplete="tel" inputmode="tel" required></div>
<div class="bk-input"><label for="cart-email">Email（選填）</label><input id="cart-email" type="email" maxlength="80" autocomplete="email"></div>
<div class="bk-input"><label for="cart-line">LINE ID（選填）</label><input id="cart-line" type="text" maxlength="40"></div>
<div class="bk-input bk-input-wide"><label for="cart-note">備註（選填）</label><textarea id="cart-note" rows="2" maxlength="300" placeholder="例如：戒圍、鍊長、送禮包裝"></textarea></div>
</div>
</div>

<div class="cart-points" id="cart-points" hidden>
<div class="filter-title" style="margin: 0">使用積分</div>
<p class="bk-hint" style="margin: 0" id="cart-points-hint"></p>
<div class="bk-pay" id="cart-points-check">
<input id="cart-points-code" type="text" maxlength="12" placeholder="過往訂單編號" aria-label="過往訂單編號" style="width: 170px; letter-spacing: 0">
<button type="button" class="bk-submit" id="cart-points-go">查詢積分</button>
</div>
<div class="bk-pay" id="cart-points-use" hidden>
<input id="cart-points-n" type="number" inputmode="numeric" min="0" step="1" aria-label="使用積分數量" style="letter-spacing: 0">
<span id="cart-points-have" style="align-self: center; color: var(--soft)"></span>
</div>
<p id="cart-points-error" class="bk-error" role="alert" hidden style="margin: 0"></p>
</div>

<dl class="cart-total">
<div><dt>商品小計</dt><dd id="cart-subtotal"></dd></div>
<div id="cart-discount-row" hidden><dt>積分折抵</dt><dd id="cart-discount"></dd></div>
<div><dt>運費</dt><dd id="cart-fee"></dd></div>
<div class="cart-grand"><dt>合計</dt><dd id="cart-grand"></dd></div>
</dl>

<label class="cart-check"><input id="cart-marketing" type="checkbox"> 我願意收到奇怪貓工作室的新品與活動消息（可隨時用 LINE 告知取消）</label>
<p id="cart-earn" class="bk-hint" style="margin: 0"></p>
<p id="cart-error" class="bk-error" role="alert" hidden></p>
<button type="submit" class="bk-submit" id="cart-submit">送出訂單</button>
<p class="bk-hint">付款方式：銀行轉帳。送出後會顯示訂單編號，匯款後回報帳號末五碼，工作室確認後出貨。<br>你填寫的資料只用於處理這筆訂單與聯絡。</p>
</form>

<div id="cart-done" hidden></div>
</div>

<h2 class="h-serif" style="font-size: 26px; margin: 72px 0 12px" id="lookup">查詢訂單</h2>
<form id="lookup-form" class="bk-pay">
<input id="lookup-code" type="text" maxlength="12" placeholder="訂單編號" aria-label="訂單編號" style="width: 160px" required>
<input id="lookup-phone" type="tel" maxlength="20" placeholder="下單手機" aria-label="下單手機" style="width: 180px; letter-spacing: 0" required>
<button type="submit" class="bk-submit">查詢</button>
</form>
<p id="lookup-error" class="bk-error" role="alert" hidden></p>
<div id="lookup-result" hidden style="margin-top: 16px"></div>
</section>
